<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Kachai store mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=block" rel="stylesheet">
<style>
  /* Картинка для RuStore: 1080×1920 (9:16). Цвета приложения: оранжевый, чёрный, белый */
  :root {
    --orange: #FF5A36;
    --orange-light: #FF7A55;
    --orange-deep: #F2441F;
    --black: #0B0B0C;
    --white: #FFFFFF;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--orange); }
  .canvas {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: linear-gradient(180deg, var(--orange-light) 0%, var(--orange) 45%, var(--orange-deep) 100%);
    font-family: "Montserrat", "Segoe UI", Arial, sans-serif; color: var(--white);
  }
  .canvas.dark { background: linear-gradient(180deg, #2A2522 0%, #161311 55%, #0B0B0C 100%); }
  .glow {
    position: absolute; width: 900px; height: 900px; left: 90px; top: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 65%);
  }
  .dark .glow { background: radial-gradient(circle, rgba(255,90,54,0.35) 0%, rgba(255,90,54,0) 65%); }
  .text { position: absolute; left: 72px; right: 72px; top: 110px; text-align: center; }
  h1 { margin: 0; font-weight: 800; font-size: 78px; line-height: 1.08; letter-spacing: -1.5px; }
  p { margin: 26px 0 0; font-weight: 600; font-size: 36px; line-height: 1.3; opacity: 0.92; }
  .phone {
    position: absolute; left: 50%; top: 500px; transform: translateX(-50%);
    width: 634px; height: 1366px; padding: 18px; box-sizing: border-box;
    background: var(--black); border-radius: 76px;
    box-shadow: 0 40px 90px rgba(60, 12, 0, 0.45), inset 0 0 0 3px #2B2B2E;
  }
  .phone img { display: block; width: 598px; height: 1330px; border-radius: 58px; object-fit: cover; }
  .camera {
    position: absolute; top: 40px; left: 50%; width: 22px; height: 22px; margin-left: -11px;
    border-radius: 50%; background: #111; box-shadow: inset 0 0 0 4px #1D1D20;
  }
  .credit {
    position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
    font: 600 20px "Segoe UI", Arial, sans-serif; opacity: 0.7;
  }
</style>
</head>
<body>
<div class="canvas {{THEME}}">
  <div class="glow"></div>
  <div class="text">
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </div>
  <div class="phone">
    <img src="../screens/{{SCREEN}}.png" alt="">
    <div class="camera"></div>
  </div>
  <div class="credit">{{CREDIT}}</div>
</div>
</body>
</html>
